<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Third Floor</title>

  <!-- Bootstrap & Fonts -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">

  <style>
    /* ========================================================================
        PAGE BACKGROUND & THEME
    ======================================================================== */
    body {
      background: url('Images/ext_elevator.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Cinzel', serif;
      color: #f0f0f0;
      margin: 0;
      height: 100vh;
    }

    /* Metallic Gradient Title */
    h1 {
      text-align: center;
      margin-top: 120px;
      margin-bottom: 50px;
      font-size: 52px;
      font-family: 'Cinzel', serif;
      background: linear-gradient(
        180deg,
        #f8f8f8 0%,
        #dcdcdc 30%,
        #a0a0a0 70%,
        #c0c0c0 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: #eaeaea;
      text-shadow:
        0 0 6px rgba(255,255,255,0.7),
        0 0 12px rgba(200,200,200,0.5),
        -1px -1px 0 #222,
        1px -1px 0 #222,
        -1px 1px 0 #222,
        1px 1px 0 #222;
    }

    main {
      text-align: center;
    }

    /* ========================================================================
        FLOOR BUTTONS
    ======================================================================== */
    .floor-button {
      font-weight: bold;
      color: #222;
      border: 2px solid #888;
      border-radius: 50%;
      width: 120px;
      height: 120px;
      font-size: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px auto;

      /* Metallic style */
      background: 
        linear-gradient(145deg, #f2f2f2, #c1c1c1 40%, #8a8a8a 70%, #d9d9d9 100%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.3) 0px, rgba(255,255,255,0.05) 2px, rgba(0,0,0,0.05) 4px);
      background-blend-mode: overlay;

      /* Inner and outer shadows for depth */
      box-shadow: inset 0 1px 2px #fff, inset 0 -2px 4px #777, 0 2px 4px rgba(0,0,0,0.4);
      transition: all 0.3s ease;
    }

    .floor-button:hover {
      filter: brightness(1.2);
      transform: scale(1.1);
    }

    .floor-button.active {
      box-shadow:
        0 0 40px 15px rgba(255, 0, 0, 1),
        0 0 60px 30px rgba(255, 0, 0, 0.7);
      transform: scale(1.2);
    }

    /* Home button spacing */
    .home-button {
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <main>
      <h1>Third Floor</h1>

      <!-- Down Button Only -->
      <button class="floor-button" id="go-down">⬇</button>
    </main>
  </div>

  <!-- Home Page Link -->
  <div class="text-center home-button">
    <a class="floor-button" href="../index.html">🏠</a>
  </div>

  <!-- Audio -->
  <audio id="click-sound" src="audio/ElevatorOpeningFinal.mp3" preload="auto"></audio>

  <script>
    const button = document.getElementById('go-down');
    const sound = document.getElementById('click-sound');

    button.addEventListener('click', () => {
      button.classList.add('active');

      if (sound) {
        sound.currentTime = 0;
        sound.play();
      }

      setTimeout(() => {
        button.classList.remove('active');
        window.location.href = 'alsaSteamGUI.html?floor=3'; // Pass floor=3
      }, 5000);
    });
  </script>
</body>
</html>
