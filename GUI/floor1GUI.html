<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>First Floor</title>

  <!-- Bootstrap & Font -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">

  <style>
    /* Main background to match ALSA Steam GUI */
    body {
      background: url('Images/ext_elevator.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Cinzel', serif;
      color: #f0f0f0;
      margin: 0;
      height: 100vh;
    }

    /* Metallic title styling with outline for visibility */
    h1 {
      text-align: center;
      margin-top: 100px;
      font-size: 52px;
      font-family: 'Cinzel', serif;

      background: linear-gradient(
        180deg,
        #f8f8f8 0%,  
        #dcdcdc 30%, 
        #a0a0a0 70%, 
        #c0c0c0 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: #eaeaea;

      /* Border-like text shadow for better contrast */
      text-shadow:
        0 0 6px rgba(255,255,255,0.7),
        0 0 12px rgba(200,200,200,0.5),
        -1px -1px 0 #222,
        1px -1px 0 #222,
        -1px 1px 0 #222,
        1px 1px 0 #222;
    }

    main {
      text-align: center;
      margin-top: 80px;
    }

    /* Polished metallic button style (circular) */
    .floor-button {
      width: 120px;
      height: 120px;
      margin: 40px auto;
      font-size: 48px;
      font-weight: bold;
      color: #222;
      border: 3px solid #888;
      border-radius: 50%;
      text-shadow: 0 1px 1px #fff;

      /* Brushed steel background */
      background: 
        linear-gradient(145deg, #f2f2f2, #c1c1c1 40%, #8a8a8a 70%, #d9d9d9 100%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.3) 0px, rgba(255,255,255,0.05) 2px, rgba(0,0,0,0.05) 4px);
      background-blend-mode: overlay;

      box-shadow: 
        inset 0 1px 2px #fff, 
        inset 0 -2px 4px #777, 
        0 2px 6px rgba(0,0,0,0.5);

      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Hover and active effects */
    .floor-button:hover {
      filter: brightness(1.2);
      transform: scale(1.1);
    }

    .floor-button.active {
      box-shadow: 
        0 0 40px #f0c97d,
        inset 0 0 20px #fff;
      transform: scale(1.2);
    }

    /* Home button container */
    .home-container {
      text-align: center;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <main>
      <h1>First Floor</h1>

      <!-- Elevator Call Button -->
      <button class="floor-button" id="call-elevator">⬆</button>
    </main>
  </div>

  <!-- Audio -->
  <audio id="click-sound" src="audio/ElevatorOpeningFinal.mp3" preload="auto"></audio>

  <!-- Home Page Link -->
  <div class="home-container">
    <a class="floor-button" href="../index.html">🏠</a>
  </div>

  <script>
    const clickSound = document.getElementById('click-sound');
    const callButton = document.getElementById('call-elevator');

    callButton.addEventListener('click', () => {
      callButton.classList.add('active');

      if (clickSound) {
        clickSound.currentTime = 0;
        clickSound.play();
      }

      setTimeout(() => {
        callButton.classList.remove('active');
        window.location.href = 'alsaSteamGUI.html?floor=1'; 
      }, 5000); 
    });
  </script>
</body>
</html>
